name: Part 1 Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required Part 1 files
        run: |
          test -Endpoint Table 1.png
          test -Endpoint Table 2.png
          test -Endpoint Table 3.png
          test -RaceDayDB.sql
          test -Endpoint Table 4.png
          test -Endpoint Table 5.png
          test -Endpoint Table 6.png
          test -Screenshot 2026-09-02 184046.png
          test -README.md
      - name: Validation successful
        run: echo "Part 1 repository structure is valid."
